services:

  postgres:
    image: postgres:15
    container_name: skills-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skills-network

  backend:
    build: .
    container_name: skills-backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - skills-network

  vault:
    image: hashicorp/vault:1.17.6
    container_name: skills-vault
    cap_add:
      - IPC_LOCK
    command: vault server -config=/vault/config/vault.hcl
    ports:
      - "8200:8200"
    volumes:
      - /home/aau/Desktop/Skills_Utilization/vault/data:/vault/data
      - ./vault/config:/vault/config
    networks:
      - skills-network

volumes:
  postgres_data:

networks:
  skills-network:
    driver: bridge
